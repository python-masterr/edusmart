name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build frontend
        env:
          API_BASE: ${{ vars.EDUSMART_API_BASE || 'https://edusmart-api.onrender.com' }}
        run: |
          mkdir -p _site/static
          cp app/static/index.html _site/index.html
          cp app/static/style.css _site/static/style.css
          cp app/static/app.js _site/static/app.js
          node -e 'const fs=require("fs"); fs.writeFileSync("_site/config.js", `window.EDUSMART_API_BASE = ${JSON.stringify(process.env.API_BASE)};\n`);'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
